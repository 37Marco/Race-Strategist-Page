<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Race Strategist is a local-first live pit-stop outcome simulator for iRacing."
    />
    <meta name="theme-color" content="#07100f" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Race Strategist — Live pit outcome</title>
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("race-strategist-theme");
          const prefersLight = matchMedia(
            "(prefers-color-scheme: light)",
          ).matches;
          document.documentElement.dataset.theme =
            savedTheme === "light" || savedTheme === "dark"
              ? savedTheme
              : prefersLight
                ? "light"
                : "dark";
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
